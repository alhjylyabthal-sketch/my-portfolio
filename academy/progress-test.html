<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار ربط الأكاديمية — نسخة تجريبية</title>
<style>body{font:18px/1.8 Tahoma,Arial,sans-serif;background:#f7f8f5;color:#173d35;max-width:620px;margin:25px auto;padding:18px}main{background:white;padding:24px;border-radius:20px;box-shadow:0 5px 20px #0001}input,button{font:inherit;padding:12px;border-radius:10px;max-width:100%;box-sizing:border-box}input{width:100%;margin-bottom:12px;border:1px solid #aaa}button{background:#17634e;color:white;border:0;cursor:pointer;margin:5px 0}button:disabled{opacity:.45}#status{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf6f2;padding:12px;border-radius:12px}small{color:#52665f}</style></head><body><main><h1>🧪 اختبار بصمة التقدم</h1><p>صفحة تطوير مستقلة عن الأكاديمية المنشورة، مخصصة للحساب التجريبي فقط.</p>
<label for="email">البريد التجريبي</label><input id="email" type="email" autocomplete="username" value="student-test-01@example.com">
<label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="لا تشاركي كلمة المرور">
<button id="login">دخول الحساب التجريبي</button><button id="logout" disabled>خروج</button>
<hr><button id="write" disabled>حفظ نتيجة اختبار افتراضية (٨٠٪)</button><button id="read" disabled>عرض نتائج الحساب التجريبي</button>
<p id="status" role="status">لم يتم الاتصال. لن تُرسل أي نتيجة إلا عند الضغط على زر الحفظ.</p>
<small>هذه الصفحة لا تسجّل نتائج طالبات حقيقيات. الحفظ لن يعمل ما دامت قواعد Firestore الحالية تمنع جميع العمليات. لا تُنشري قواعد جديدة قبل اختبارها.</small></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,addDoc,getDocs,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const TEST_UID='pn7gpfwoeVOi1Q6pFA6gHS8lHmt2';
const $=id=>document.getElementById(id),status=message=>{$('status').textContent=message;};
function allowed(){return auth.currentUser?.uid===TEST_UID;}
onAuthStateChanged(auth,user=>{const ok=user?.uid===TEST_UID;$('write').disabled=!ok;$('read').disabled=!ok;$('logout').disabled=!user;status(user?(ok?'تم تسجيل دخول الحساب التجريبي. يمكنك اختبار الحفظ بعد تفعيل قواعد مختبرة.':'هذا ليس الحساب التجريبي؛ لا يُسمح بحفظ النتائج هنا.'):'لا يوجد حساب مسجل الدخول.');});
$('login').onclick=async()=>{try{const c=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value='';if(c.user.uid!==TEST_UID){await signOut(auth);status('الحساب غير مطابق للحساب التجريبي.');}}catch(e){status('تعذر تسجيل الدخول: '+e.code);}};
$('logout').onclick=async()=>{await signOut(auth);status('تم تسجيل الخروج.');};
$('write').onclick=async()=>{if(!allowed())return;try{await addDoc(collection(db,'studentResults',TEST_UID,'attempts'),{lesson:'test-only',title:'اختبار تجريبي — ليس درسًا حقيقيًا',chapter:1,score:80,correct:4,total:5,completedAt:serverTimestamp()});status('نجح حفظ النتيجة الافتراضية في Firestore.');}catch(e){status('لم تُحفظ النتيجة: '+e.code+' — هذا متوقع مع القواعد الحالية المغلقة.');}};
$('read').onclick=async()=>{if(!allowed())return;try{const docs=await getDocs(collection(db,'studentResults',TEST_UID,'attempts'));status('عدد نتائج الحساب التجريبي: '+docs.size+'\n'+docs.docs.map(x=>x.data().title+' — '+x.data().score+'٪').join('\n'));}catch(e){status('تعذر قراءة النتائج: '+e.code);}};
</script></body></html>
