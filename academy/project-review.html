<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة المشاريع | المعلمة</title><style>*{box-sizing:border-box}body{font:18px Tahoma,Arial;background:#f4f8fa;color:#17364b;margin:auto;max-width:760px;padding:18px}section{background:white;padding:18px;border-radius:18px;margin:15px 0;border:1px solid #cbdcdc}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:10px;border:1px solid #9cb4b9;border-radius:10px;max-width:100%}input:not([type=checkbox]),select{width:100%}button{background:#17655e;color:white;cursor:pointer;margin:6px 0}article{border-top:1px solid #ddd;padding:12px 0}small{display:block;line-height:1.8}</style><a href="./#projects">العودة إلى المشاريع</a><h1>متابعة المشاريع العملية</h1><p>سجل محلي للمعلمة — لا يتصل بحسابات الطلاب ولا يمنح أوسمة إلكترونية حاليًا. استخدميه على جهازك الخاص فقط.</p><section><form id="f"><label>الشعبة<select id="cl"><option>أولى ١</option><option>أولى ٢</option><option>أولى ٣</option><option>أولى ٤</option></select></label><label>اسم الطالب أو رمزه<input id="student" required maxlength="100" autocomplete="off"></label><label>المشروع<select id="p"></select></label><label><input type="checkbox" required> اطلعت على العمل في ملف الإنجاز الورقي</label><label><input type="checkbox" required> تحققت من مشاركة الطالب وصحة المفهوم الرياضي</label><label><input type="checkbox" required> استمعت إلى شرح الطالب</label><button type="submit">حفظ الاعتماد في سجل المعلمة</button></form><p id="msg" role="status"></p></section><section><h2>الاعتمادات المسجلة</h2><button id="export">حفظ نسخة احتياطية</button><div id="list"></div></section><script>const names=['قطار الأعداد','حديقة العشرات','حقيبة أشيائي','من الأكبر؟','سُلّم الأعداد','أنماط من حياتي'];const key='academy-teacher-project-review-v1';const $=id=>document.getElementById(id);let rows=[];try{rows=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(rows))throw Error()}catch(e){$('msg').textContent='تعذر قراءة السجل المحلي؛ لن يُستبدل.';$('f').querySelector('button').disabled=true;rows=[]}names.forEach((n,i)=>{const o=document.createElement('option');o.value=i;o.textContent=n;$('p').append(o)});function render(){const list=$('list');list.replaceChildren();if(!rows.length)list.textContent='لا توجد اعتمادات مسجلة بعد.';rows.slice().reverse().forEach(r=>{const a=document.createElement('article');a.textContent=r.cl+' — '+r.student+' — '+names[r.p]+' — '+new Date(r.date).toLocaleDateString('ar-SA');list.append(a)})} $('f').onsubmit=e=>{e.preventDefault();const student=$('student').value.trim();if(!student)return;const r={student,cl:$('cl').value,p:Number($('p').value),date:new Date().toISOString()};if(rows.some(x=>x.student===r.student&&x.cl===r.cl&&x.p===r.p)){$('msg').textContent='هذا المشروع معتمد مسبقًا.';return}try{const next=[...rows,r];localStorage.setItem(key,JSON.stringify(next));rows=next;$('msg').textContent='تم حفظ الاعتماد محليًا.';e.target.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);render()}catch(e){$('msg').textContent='تعذر الحفظ.'}};$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));a.download='اعتمادات-المشاريع.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render()</script></html>
