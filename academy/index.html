<style>
:root{
  --navy:#112f50;--navydeep:#082640;--gold:#dfad45;--goldsoft:#fff2d5;
  --teal:#0f9099;--tealdeep:#087b84;--ink:#163453;--muted:#58718a;
  --paper:#fcfbf6;--cream:#fff9ef;--line:#d8e5ee;--shadow:0 12px 35px #0b3b5c19;
  font-family:"Tajawal","Cairo","Noto Sans Arabic",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-width:320px;color:var(--ink);background:radial-gradient(ellipse 75% 26% at 50% 32%,#eaf8fb 0%,transparent 75%),linear-gradient(#fffefa,#fffaf2);font-size:16px;line-height:1.65}
button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.53}
button:focus-visible,a:focus-visible{outline:3px solid #e89c28;outline-offset:4px}
a{color:inherit}.skip{position:absolute;top:-80px;z-index:100}.skip:focus{top:5px}
.topbar{background:linear-gradient(118deg,#123a5d,#092942 55%,#184a69);color:#fff;border-bottom:4px solid var(--gold);position:relative;z-index:10;box-shadow:0 6px 15px #11385824}
.topbar:before{content:"";pointer-events:none;position:absolute;inset:0;background:radial-gradient(circle at 38% 100%,#2d63733b,transparent 38%)}
.topbar-inner{position:relative;max-width:1200px;min-height:74px;margin:auto;padding:7px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.topicon{border:1px solid #ffffff55;color:white;background:#ffffff10;border-radius:15px;width:46px;height:44px;font-size:30px;line-height:1}
.top-actions{display:flex;align-items:center;gap:12px}.top-actions .topicon{font-size:31px}
.user-chip{border-radius:40px;padding:6px 17px;border:1px solid #dfbe7a96;background:#082c46bf;font-size:13px;white-space:nowrap}
.brand-mini{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:900;text-align:center;cursor:pointer}
.brand-mini img{height:47px;width:58px;object-fit:contain;background:#fff8;border-radius:16px}
.topnav{position:absolute;top:100%;right:12px;min-width:230px;background:#fff;box-shadow:0 18px 38px #102f4a38;padding:10px;display:grid;gap:5px;border:1px solid #cfdfed;border-radius:17px}
.topnav[hidden]{display:none}
.topnav button{background:none;color:var(--ink);border:0;text-align:right;font-weight:800;border-radius:11px;padding:11px 14px}
.topnav button:hover{background:#eaf6f8}
main{max-width:1170px;margin:0 auto;min-height:56vh;padding:0 22px 36px}
button.primary,button.secondary,.outline-button{border:0;border-radius:15px;font-weight:900;padding:12px 21px}
button.primary{background:linear-gradient(130deg,#078b98,#087783);color:white;box-shadow:0 7px 14px #16828e3d}
button.secondary{background:var(--goldsoft);color:#715015;border:1px solid #eecb78}
.outline-button{border:1px solid #b9d5e2;background:white;color:var(--navy)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.hero{max-width:1050px;margin:0 auto;position:relative;isolation:isolate;text-align:center;padding-top:18px}
.hero:before{content:"";position:absolute;z-index:-2;top:0;left:0;right:0;height:440px;background:radial-gradient(ellipse 62% 72% at 50% 64%,#e7faff 0%,#e7f9ff65 65%,transparent 100%);border-radius:0 0 50% 50%}
.hero-logo{display:flex;align-items:center;flex-direction:column;gap:1px;position:relative;z-index:1}
.hero-logo img{width:92px;max-width:22%;height:72px;object-fit:contain;mix-blend-mode:multiply}
.hero-logo h1{margin:-4px 0 1px;color:var(--navy);font-size:clamp(22px,4vw,37px);line-height:1.35;font-weight:950;text-shadow:0 1px white;letter-spacing:-.6px}
.hero-logo h1:before,.hero-logo h1:after{content:"❧";color:#d6a239;display:inline-block;margin:0 16px;transform:rotate(-20deg)}
.hero-stage{margin:14px auto 0;min-height:313px;display:flex;align-items:center;justify-content:center;position:relative}
.hero-person{position:absolute;bottom:0;width:27%;max-height:330px;object-fit:cover;object-position:center 25%;border-radius:35% 35% 20px 20px;filter:drop-shadow(0 7px 8px #153b3c1a);mask-image:linear-gradient(to right,transparent 0%,black 10%,black 90%,transparent),linear-gradient(to top,transparent 0%,black 12%);mask-composite:intersect}
.hero-boy{left:0}.hero-girl{right:0}
.chalk{width:51%;min-height:257px;position:relative;z-index:2;margin-bottom:7px;background:radial-gradient(circle at 55% 40%,#1c666c,#0a414d 82%);border:11px solid #a97136;border-bottom-color:#8c5d2d;border-radius:24px;box-shadow:inset 0 0 0 3px #e1a95d,0 12px 16px #063d5b46,0 3px 0 #6c421c;display:flex;flex-direction:column;justify-content:center;padding:19px 12px 16px;color:#fffbed}
.chalk:after{content:"";position:absolute;inset:11px;border:2px solid #ffffff1c;border-radius:6px;pointer-events:none}
.chalk .hello{font-size:clamp(15px,2vw,23px);font-weight:800}
.chalk .headline{font-size:clamp(21px,3vw,37px);font-weight:1000;line-height:1.5;text-shadow:0 3px #0004}
.ribbon{align-self:center;background:linear-gradient(90deg,#d49b2b,#ffda60,#d49b2b);border:2px solid #ebbd48;border-radius:11px;color:#163a55;padding:6px 23px;font-weight:900;margin-top:10px;box-shadow:0 3px 4px #0033}
.quick-links{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative;z-index:3;padding:10px;background:linear-gradient(165deg,#fffdf5,#fffaf0);border-radius:35px;border:2px solid #fff;box-shadow:0 5px 0 #f1e4d2,0 10px 25px #28455626;margin:-1px auto 30px;max-width:1000px}
.quick-card{border:0;border-left:1px solid #e7e8e8;background:linear-gradient(170deg,#ffffff,#f7f8f8);border-radius:26px;min-height:112px;color:var(--navy);font-weight:950;font-size:clamp(15px,2.7vw,25px);display:grid;align-content:center;justify-items:center;transition:transform .2s ease,box-shadow .2s ease}
.quick-card:hover,.grade-card:hover,.chapter-card:hover{transform:translateY(-3px)}
.quick-card:active,.grade-card:active,.chapter-card:active{transform:translateY(1px)}
.quick-symbol{width:58px;height:58px;display:grid;place-items:center;font-size:36px;filter:drop-shadow(1px 3px 2px #415b6b36)}
.section-heading{font-size:clamp(24px,3vw,32px);text-align:center;color:var(--navy);font-weight:950;margin:24px 0 11px}
.progress-panel{background:linear-gradient(135deg,#ddf7fa,#bdebee 47%,#e9ffff);border:4px solid white;box-shadow:0 7px 22px #163d4c25;border-radius:43px;display:flex;align-items:center;gap:26px;padding:16px 30px;margin:0 auto 28px;max-width:1050px;position:relative}
.progress-panel .book-cover{width:130px;min-width:110px;height:164px;object-fit:cover;border-radius:4px;box-shadow:9px 9px 11px #09394d33;transform:rotate(6deg)}
.progress-copy{flex:1;min-width:0;text-align:center}.progress-copy h2{font-size:clamp(22px,3.5vw,31px);color:#0b3051;margin:0}.progress-copy p{margin:0 0 18px;font-size:19px;font-weight:800}
.progress-label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:14px}
.progress-track{margin-top:9px;width:100%;height:18px;border-radius:20px;border:3px solid #fff;background:#f9ffff;box-shadow:inset 0 2px 5px #2947622c;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#03a0ab,#00816d);width:0%;border-radius:20px;transition:width .3s}
.now-badge{position:absolute;top:-23px;right:18px;background:linear-gradient(115deg,#087b8b,#0c9eaa);color:#fff;border-radius:22px;padding:5px 22px;font-weight:900;box-shadow:0 5px 9px #104c6033}
.grade-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin-top:12px}
.grade-card{border:3px solid #fff;outline:1px solid #cadce4;color:var(--navy);background:linear-gradient(180deg,#f2fafd,#e5f1fa);border-radius:27px;min-height:174px;padding:18px 6px;box-shadow:0 6px 10px #17405a20;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.4;transition:transform .2s ease}
.grade-card strong{font-size:clamp(15px,2.2vw,24px)}.grade-card small{font-size:clamp(11px,1.55vw,17px);font-weight:800;margin-top:2px}
.grade-card .grade-icon{font-size:clamp(30px,4vw,47px);margin-bottom:10px}
.grade-card .lock{font-size:19px;opacity:.65;margin-top:8px}
.grade-card.selected{border-color:#eebd42;outline:2px solid #d7a630;background:linear-gradient(180deg,#fffefa,#fff2d4);box-shadow:0 7px 15px #bd8d2840}
.grade-card.selected:after{content:"✓";position:absolute;top:-14px;left:-9px;background:#dca52f;color:white;font-weight:bold;border:2px solid white;border-radius:50%;height:30px;width:30px;display:grid;place-items:center}
.page-top{padding:32px 0 16px;text-align:center}
.breadcrumb{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;color:#4b6683;font-size:13px;margin:0 0 14px}
.breadcrumb button{background:none;border:0;color:var(--tealdeep);font-weight:900;padding:3px}
.page-top h1{font-size:clamp(25px,4vw,36px);color:var(--navy);margin:0 0 5px;font-weight:950}.page-top p{color:var(--muted);margin:0 auto;max-width:800px}
.mascot-strip{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px auto 0;max-width:600px;min-height:65px;border-radius:20px;border:1px solid #d9e8e8;background:linear-gradient(120deg,#f9fcfc,#e8f7f9,#fff8e9);overflow:hidden;box-shadow:0 3px 9px #29476312}
.mascot-strip img{width:65px;height:70px;object-fit:cover;object-position:top;border-radius:22px;mask-image:linear-gradient(to top,transparent,black 22%)}
.mascot-strip span{font-size:13px;font-weight:900;color:#3d7082}
.page-banner{display:flex;gap:18px;align-items:center;background:linear-gradient(130deg,#edfaff,#fff4df);border:1px solid #d9e8ed;border-radius:25px;box-shadow:var(--shadow);padding:16px 20px;margin:15px auto 22px}
.page-banner img{width:85px;height:90px;object-fit:cover;border-radius:13px;mask-image:linear-gradient(to top,transparent,black 20%)}.page-banner div{flex:1}
.chapter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chapter-card{border:1px solid #dce6ef;background:white;border-radius:25px;box-shadow:var(--shadow);padding:21px;text-align:right;color:var(--ink);transition:transform .2s}
.chapter-icon{background:linear-gradient(130deg,#d5f6f8,#f8f0cf);display:grid;place-items:center;width:62px;height:62px;border-radius:20px;font-size:37px;margin-bottom:12px}
.chapter-card .number{font-size:13px;color:#648097;font-weight:800}
.chapter-card strong{display:block;font-size:20px;color:var(--navy);margin:3px 0}
.chapter-card p{font-size:13px;line-height:1.9;color:var(--muted);margin:5px 0 15px}
.chapter-card .enter{display:flex;justify-content:space-between;align-items:center;color:var(--tealdeep);font-weight:900}
.list-heading{font-size:21px;color:var(--navy);margin:23px 0 10px}
.lesson-list{display:grid;gap:9px}.lesson-row{display:flex;align-items:center;gap:12px;background:white;border:1px solid #dae7ed;border-radius:17px;padding:11px 14px;box-shadow:0 2px 9px #0f3e5520}
.lesson-row .chapter-index{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#e8f8f8;font-size:18px;color:var(--tealdeep);font-weight:900;flex:none}
.lesson-row .rowcopy{flex:1;min-width:0}.lesson-row strong{display:block;font-size:15px}.lesson-row small{color:var(--muted);font-size:12px}
.lesson-row button{border:0;border-radius:12px;background:#0d8994;color:white;font-weight:900;padding:10px 16px;white-space:nowrap}
.lesson-row button.test-button{background:#c9902c}
.lesson-row.done{border-color:#90d9ce}.done-tag{font-size:12px;color:#078577}
.mode-tabs{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:17px 0}
.mode-tabs button{background:#fff;border:1px solid #c6dde5;border-radius:40px;padding:8px 14px;color:var(--navy);font-weight:900}
.mode-tabs button.active{background:var(--teal);color:#fff}
.practice-wrap{max-width:800px;margin:17px auto 35px}
.lesson-intro{background:linear-gradient(130deg,#effbfb,#fff9e6);padding:21px;border-radius:25px;border:1px solid #d7e8ec;margin:12px 0 18px}
.lesson-intro strong{color:var(--navy);font-size:19px}.lesson-intro p{margin:4px 0 7px}.objective-tag{display:inline-flex;border-radius:20px;padding:2px 12px;background:#fff;border:1px solid #d1e1e6;color:#427081;font-weight:800;font-size:12px}
.practice-card{padding:20px;border-radius:27px;background:#fff;border:1px solid #dce8ed;box-shadow:var(--shadow);text-align:center}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);font-weight:800;text-align:right}
.quiz-bar{height:9px;background:#eaf3f4;border-radius:15px;overflow:hidden;margin:11px 0 20px}
.quiz-bar>div{height:100%;background:linear-gradient(90deg,#18adaf,#d6a93c);transition:width .25s}
.question-title{font-size:clamp(19px,3.5vw,25px);line-height:1.75;color:var(--navy);margin:7px auto 15px;max-width:680px;font-weight:950}
.visual-box{border-radius:20px;padding:17px 12px;background:linear-gradient(140deg,#f4fcfc,#fff9e6);min-height:91px;display:grid;place-items:center;margin:7px auto 18px;max-width:670px}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.option{border:2px solid #cfdee8;background:#fff;border-radius:17px;min-height:82px;padding:12px 8px;color:var(--ink);font-size:21px;font-weight:900;display:grid;place-items:center;transition:background .12s,border-color .12s;overflow-wrap:anywhere}
.option:hover:not(:disabled){border-color:#45b4b7;background:#f1fdfe}.option.correct{border-color:#1aab7c;background:#dffaf0;color:#126b53;opacity:1}.option.wrong{border-color:#d35e62;background:#fff0ef;color:#9a2c2c;opacity:1}
.feedback{border-radius:15px;margin-top:17px;padding:12px 15px;background:#e4f9f0;border:1px solid #8acfb1;text-align:right;font-weight:900}
.feedback.wrong{background:#fff5e7;border-color:#efc488;color:#80561f}.feedback p{font-weight:500;margin:3px 0}
.quiz-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}
.score-stars{font-size:22px;color:#bd8a28}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:340px}
.dot-shape{display:inline-flex;justify-content:center;align-items:center;font-size:26px;line-height:1.4}
.tenframe{display:grid;grid-template-columns:repeat(5,32px);gap:3px;justify-content:center;direction:ltr}
.tenframe span{display:grid;place-items:center;width:32px;height:32px;background:#fff;border:1px solid #95b8cb;border-radius:7px;color:#09959e}
.count-container{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.shape{display:inline-block;vertical-align:middle;width:44px;height:44px;box-shadow:0 2px 4px #0002;margin:4px;border:2px solid #fff}
.shape.circle{border-radius:50%}.shape.square{border-radius:9px}.shape.triangle{clip-path:polygon(50% 0,0 100%,100% 100%);border:0}
.shape.red{background:#f05a61}.shape.blue{background:#2494d3}.shape.yellow{background:#f2b839}.shape.green{background:#4ab792}
.shape.small{width:29px;height:29px;margin:0 3px}
.position-stack{display:grid;gap:4px;justify-content:center;place-items:center}.position-stack>span{background:#fff;border:1px solid #cde2ed;border-radius:10px;padding:8px 19px;min-width:120px;font-size:29px}
.pattern{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:9px;direction:rtl}.pattern .shape{margin:0}
.numbers-strip{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:23px;font-weight:900}.numbers-strip span{background:white;border:1px solid #b9d7e5;border-radius:12px;padding:4px 13px}
.math-vertical{font-size:31px;font-weight:900;text-align:left;line-height:1.4;direction:ltr;display:inline-block;min-width:75px}
.math-vertical .under{border-bottom:3px solid var(--navy)}
.result-card{text-align:center;border-radius:27px;background:linear-gradient(135deg,#e8f9f7,#fff5dc);padding:28px 20px;box-shadow:var(--shadow)}
.result-card .result-icon{font-size:57px}.result-card h2{font-size:28px;margin:8px 0}.result-card .bigscore{font-size:43px;color:var(--tealdeep);font-weight:1000}
.info-note{border:1px solid #d7e4e9;background:#fff9e8;border-radius:16px;padding:12px 15px;margin:20px auto;font-size:14px;max-width:800px;color:#71562b}
.evidence-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:800px;margin:16px auto}
.stat{background:#fff;border:1px solid #d9e8ed;border-radius:18px;padding:17px 10px;text-align:center}.stat strong{display:block;font-size:28px;color:var(--tealdeep)}.stat span{font-size:12px;color:var(--muted)}
.notice{padding:18px;border-radius:18px;background:#eef9fb;border:1px solid #c4e2e6;max-width:780px;margin:12px auto}
.evidence-history{max-width:800px;margin:auto}.evidence-history article{padding:12px 15px;border:1px solid #dce5e8;background:white;border-radius:13px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.footer{text-align:center;color:#fff;font-size:14px;background:#0d324b;padding:0 0 24px;margin-top:34px}
.footer img{display:block;width:100%;height:auto;max-height:200px;object-fit:cover;object-position:center bottom;margin-bottom:12px}.footer span{color:#e9b94f}.footer small{color:#cbdce2}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,25px);background:#0d324d;color:white;padding:12px 19px;border-radius:14px;z-index:20;box-shadow:0 6px 25px #0005;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){
  .topbar-inner{min-height:66px;padding:8px 12px}.user-chip{display:none}.brand-mini{font-size:13px}.brand-mini img{height:38px;width:43px}
  main{padding:0 12px 28px}.hero-logo img{height:58px}.hero-logo h1:before,.hero-logo h1:after{margin:0 6px}
  .hero-stage{min-height:255px}.hero-person{width:32%;max-height:245px}.chalk{width:53%;min-height:211px;border-width:7px;padding:12px 8px}.ribbon{padding:5px;font-size:11px}
  .quick-links{border-radius:22px}.quick-card{border-radius:17px;min-height:91px;font-size:15px}.quick-symbol{font-size:27px;width:43px;height:41px}
  .progress-panel{border-radius:27px;padding:24px 14px 14px;gap:10px}.progress-panel .book-cover{width:88px;min-width:88px;height:116px}
  .progress-copy p{font-size:14px;margin-bottom:8px}.progress-label{font-size:12px}.now-badge{font-size:12px;top:-18px}
  .chapter-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.chapter-card{padding:14px}.chapter-card strong{font-size:17px}.chapter-card p{font-size:12px}
  .grade-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.grade-card{min-height:139px;border-radius:20px}.grade-card .grade-icon{font-size:36px;margin-bottom:5px}.grade-card strong{font-size:18px}.grade-card small{font-size:13px}
  .practice-card{padding:16px 12px}.option{min-height:73px;font-size:18px}
}
@media(max-width:420px){
  .brand-mini span{max-width:158px;line-height:1.22;text-align:right}
  .hero-logo h1{font-size:21px}.hero-stage{min-height:209px}.hero-person{width:32%;max-height:200px}.hero-boy{left:-7px}.hero-girl{right:-7px}
  .chalk{width:58%;min-height:175px;border-width:6px;border-radius:15px}.chalk .headline{font-size:20px}.chalk .hello{font-size:14px}.ribbon{font-size:9px}
  .quick-links{gap:4px;padding:5px}.quick-card{min-height:80px;font-size:13px;border-radius:13px}.quick-symbol{font-size:23px;height:34px}
  .progress-panel .book-cover{width:66px;min-width:66px;height:93px}.progress-copy h2{font-size:18px}
  .grade-card{min-height:131px}.chapter-card strong{font-size:16px}.lesson-row{padding:9px}.lesson-row strong{font-size:13px}.lesson-row button{font-size:12px;padding:9px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

/* أدوات المعلمة بعيدة عن واجهة الطالب */
.teacher-tools{max-width:800px;margin:16px auto;border:1px solid #d5e3e9;background:#fff;border-radius:16px;padding:12px 17px;color:var(--muted);font-size:14px}
.teacher-tools summary{cursor:pointer;font-size:14px;color:var(--navy);font-weight:900;user-select:none}
.teacher-tools p{margin:12px 0}
.teacher-tools:not([open]){background:transparent;border-color:transparent;text-align:center}

function chapterCards(mode='lessons'){
return `<section class="chapter-grid">${CHAPTERS.map(c=>{
const done=c.lessons.filter(l=>progress[l[0]]).length;
return `<button class="chapter-card" data-chapter="${c.id}" data-mode="${mode}">
 <div class="chapter-icon">${c.icon}</div><span class="number">الفصل ${arabic(c.id)}</span><strong>${c.title}</strong><p>${c.about}</p>
 <span class="enter">${mode==='tests'?'عرض التقويمات':`${arabic(done)} من ${arabic(c.lessons.length)} دروس مكتملة`}<span aria-hidden="true">←</span></span></button>`}).join('')}</section>`}

function chapterEntries(c,mode){if(mode==='tests')return TEST_TYPES.map(([type])=>testById(`ch${c.id}-${type}`));
 const lessons=c.lessons.map(row=>lessonById(row[0]));
 const insertion=(type)=>testById(`ch${c.id}-${type}`);
 const firstHalf=(c.id===1?3:c.id===2?3:c.id===3?3:c.id===4?4:c.id===5?4:4);
 if(mode==='games')return lessons;
 return [insertion('prep'),...lessons.slice(0,firstHalf),insertion('mid'),insertion('reviewMid'),...lessons.slice(firstHalf),insertion('review'),insertion('test'),insertion('cumulative')];
}
function renderChapter(id,mode){const c=chapterById(id);if(!c)return renderHome();pageMode=['games','tests'].includes(mode)?mode:'lessons';const entries=chapterEntries(c,pageMode);
return `${pageHeader(`${c.icon} الفصل ${arabic(c.id)}: ${c.title}`,'اختر درسًا، واستعدّ لتحدٍّ جديد!',c.title)}
<div class="mode-tabs">${[['lessons','جميع الدروس'],['games','الألعاب'],['tests','الاختبارات']].map(([m,l])=>`<button class="${m===pageMode?'active':''}" data-chapter="${c.id}" data-mode="${m}">${l}</button>`).join('')}</div>
<div class="lesson-list">${entries.map((l,i)=>{let done=progress[l.code],isTest=!!l.testType;
return `<article class="lesson-row ${done?'done':''}"><span class="chapter-index">${isTest?'★':arabic(i+1)}</span>
 <div class="rowcopy"><strong>${l.title}</strong><small>${isTest?'تقويم الفصل':'الدرس '+l.code} • صفحة ${arabic(l.page)} ${done?`<span class="done-tag">• أنجزت: ${arabic(done.best)}٪</span>`:''}</small></div>
 <button class="${isTest?'test-button':''}" data-lesson="${l.code}">${done?'إعادة':'ابدأ'} ←</button></article>`}).join('')}</div><div class="info-note">✏️ لا تنسَ التدرّب على كتابة الأعداد في دفترك أيضًا!</div>`;
}
/* ===== أنشطة أصلية محددة المهارة، لا أسئلة قصصية تخيلية ===== */
function circleDots(n,color='#15969e'){

 if(lesson.testType){
  const chap=lesson.chapter,part=lesson.testType;
  const relevant=part==='prep'?chap.lessons.slice(0,Math.min(3,chap.lessons.length)):
    part==='mid'||part==='reviewMid'?chap.lessons.slice(0,Math.ceil(chap.lessons.length/2)):
    part==='cumulative'?CHAPTERS.filter(c=>c.id<=chap.id).flatMap(c=>c.lessons):chap.lessons;
  for(let i=0;i<count;i++){const row=relevant[(i*7+Math.floor(i/3))%relevant.length];out.push(generate(row[2],i+Math.floor(i/2)));}
 }else for(let i=0;i<count;i++)out.push(generate(lesson.skill,i));
 return out;
}
function beginLesson(id){const lesson=lessonRecord(id);if(!lesson){showToast('الدرس غير موجود');return;}
 session={lesson,questions:questionsFor(lesson,lesson.testType?8:6),index:0,score:0,selected:null};navigate('practice/'+id);
}
function startView(id){const lesson=lessonRecord(id);if(!lesson)return renderCategory('lessons');
 if(!session||session.lesson.code!==id)session={lesson,questions:questionsFor(lesson,lesson.testType?8:6),index:0,score:0,selected:null};
 const s=session,question=s.questions[s.index];
 return `${pageHeader(lesson.title,`${lesson.chapter.title} • الصفحة ${arabic(lesson.page)} من الكتاب`,lesson.title)}<section class="practice-wrap">
 <div class="lesson-intro"><strong>🎯 اليوم سنتعلّم</strong><p>${lesson.objective}</p><span class="objective-tag">الصف الأول الابتدائي • الفصل ${arabic(lesson.chapter.id)}</span></div>
 ${question?renderQuestion(s,question):renderResult(s)}
 </section>`;
}
function renderQuestion(s,q){return `<section class="practice-card">
 <div class="quiz-top"><span>السؤال ${arabic(s.index+1)} من ${arabic(s.questions.length)}</span><span>✅ الصحيح: ${arabic(s.score)}</span></div>
 <div class="quiz-bar"><div style="width:${(s.index/s.questions.length)*100}%"></div></div>
 <h2 class="question-title">${q.prompt}</h2><div class="visual-box">${q.visual}</div>
 <div class="options" role="group" aria-label="خيارات الإجابة">${q.choices.map((option,i)=>{
  const selected=s.selected!==null,selectedClass=selected?(option.correct?'correct':s.selected===i?'wrong':''):'';
  const label=option.html||option.text;
  return `<button class="option ${selectedClass}" data-answer="${i}" ${selected?'disabled':''} aria-label="الخيار ${arabic(i+1)}: ${option.text||'شكل مرسوم'}">${label}</button>`;
 }).join('')}</div>
 ${s.selected!==null?`<div class="feedback ${q.choices[s.selected].correct?'':'wrong'}"><strong>${q.choices[s.selected].correct?'🌟 ممتاز! إجابة صحيحة.':'💡 محاولة جيدة، شاهد الإجابة الصحيحة.'}</strong><p>${q.explain}</p></div>`:''}
 <div class="quiz-footer"><span class="score-stars">${'⭐'.repeat(Math.min(s.score,5))}</span>${s.selected!==null?`<button class="primary" data-next>${s.index===s.questions.length-1?'عرض النتيجة':'السؤال التالي ←'}</button>`:'<span style="color:#668099;font-size:13px">اضغط على الإجابة الصحيحة</span>'}</div>
 </section>`;
}
function saveResult(s){const id=s.lesson.code,score=Math.round(s.score/s.questions.length*100),old=progress[id]||{};
 const attempt={lesson:id,title:s.lesson.title,chapter:s.lesson.chapter.id,score,correct:s.score,total:s.questions.length,date:new Date().toISOString()};
 progress[id]={best:Math.max(old.best||0,score),attempts:(old.attempts||0)+1,last:score,updated:attempt.date};
 if(!Array.isArray(progress.history))progress.history=[];progress.history.push(attempt);progress.history=progress.history.slice(-200);
 try{localStorage.setItem(storedKey,JSON.stringify(progress))}catch{showToast('تعذر حفظ التقدم على هذا الجهاز')}
}
function renderResult(s){if(!s.saved){saveResult(s);s.saved=true;}const percent=Math.round(s.score/s.questions.length*100);
return `<section class="result-card"><div class="result-icon">${percent===100?'🏆':percent>=70?'🌟':'🌱'}</div>
 <h2>${percent>=80?'أحسنت!':'أنهيت التدريب، ونستطيع التحسن أكثر'}</h2><p>نتيجتك في <strong>${s.lesson.title}</strong></p><div class="bigscore">${arabic(s.score)} / ${arabic(s.questions.length)}</div><p>${arabic(percent)}٪ إجابات صحيحة</p>
 <div class="btnrow"><button class="primary" data-retry="${s.lesson.code}">🔄 حاول مرة أخرى</button><button class="secondary" data-chapter="${s.lesson.chapter.id}" data-mode="${s.lesson.testType?'tests':'lessons'}">📚 العودة إلى الفصل</button><button class="outline-button" data-nav="evidence">📊 عرض نتائجي</button></div>
 </section>`;
}
function answerQuestion(index){if(!session||session.selected!==null)return;const q=session.questions[session.index];if(!q||!q.choices[index])return;
 session.selected=index;if(q.choices[index].correct)session.score++;
 const card=document.querySelector('.practice-card');if(card)card.outerHTML=renderQuestion(session,q);
}
function nextQuestion(){if(!session||session.selected===null)return;session.index++;session.selected=null;const card=document.querySelector('.practice-card');
 if(session.index>=session.questions.length){const wrap=document.querySelector('.practice-wrap');if(wrap){wrap.querySelector('.practice-card')?.remove();wrap.insertAdjacentHTML('beforeend',renderResult(session));}}else if(card){card.outerHTML=renderQuestion(session,session.questions[session.index]);}
 window.scrollTo({top:Math.max(0,document.querySelector('.practice-wrap')?.getBoundingClientRect().top+window.scrollY-30||0),behavior:'smooth'});
}
function renderEvidence(){const history=Array.isArray(progress.history)?progress.history:[];const best=CHAPTERS.flatMap(c=>c.lessons.map(l=>progress[l[0]]?.best).filter(x=>typeof x==='number'));
const average=best.length?Math.round(best.reduce((a,b)=>a+b,0)/best.length):0;
return `${pageHeader('🏅 الشواهد والإنجازات','شاهد نجومك ونتائجك بعد كل لعبة أو تدريب!','الشواهد')}
 <div class="evidence-summary"><div class="stat"><strong>${arabic(completedCount())}</strong><span>دروس أُنجزت</span></div><div class="stat"><strong>${arabic(history.length)}</strong><span>محاولات</span></div><div class="stat"><strong>${arabic(average)}٪</strong><span>متوسط أفضل النتائج</span></div></div>
 <details class="teacher-tools"><summary>للمعلمة</summary><p>النتائج محفوظة على هذا الجهاز فقط، ولا تُرسل إلى المعلمة تلقائيًا.</p>
 <div class="btnrow"><button class="primary" data-export="csv">حفظ سجل النتائج</button><button class="secondary" data-export="json">حفظ نسخة احتياطية</button></div></details>
 <h2 class="list-heading">آخر التدريبات</h2><section class="evidence-history">${history.length?history.slice().reverse().slice(0,20).map(r=>`<article><span><strong>${r.title}</strong><br><small>الفصل ${arabic(r.chapter)} • ${new Date(r.date).toLocaleDateString('ar-SA')}</small></span><strong>${arabic(r.score)}٪</strong></article>`).join(''):'<div class="notice">لم تُسجّل تدريبات على هذا الجهاز بعد. ابدأ من الدروس، وبعد الإجابة ستظهر النتائج هنا.</div>'}</section>`;
}
function downloadBlob(filename,text,mime){const blob=new Blob(['\ufeff',text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportResults(format){const items=Array.isArray(progress.history)?progress.history:[];
 if(!items.length){showToast('لا توجد نتائج بعد؛ أكملي تدريبًا أولًا.');return;}
 if(format==='json')downloadBlob('academy-progress-backup.json',JSON.stringify({version:1,exported:new Date().toISOString(),results:items},null,2),'application/json;charset=utf-8');
 else{const fields=['الدرس','الفصل','الدرجة المئوية','الإجابات الصحيحة','إجمالي الأسئلة','التاريخ'];const quote=s=>'"'+String(s).replaceAll('"','""')+'"';const csv=[fields.map(quote).join(','),...items.map(x=>[x.title,x.chapter,x.score,x.correct,x.total,x.date].map(quote).join(','))].join('\r\n');downloadBlob('academy-results.csv',csv,'text/csv;charset=utf-8');}
 showToast('تم إعداد ملف النتائج للتنزيل');
}
function render(){const parts=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/'),type=parts[0]||'home';const app=document.getElementById('app');if(!app)return;
 if(type==='home')app.innerHTML=renderHome();
 else if(['lessons','games','tests'].includes(type))app.innerHTML=renderCategory(type);
 else if(type==='chapter')app.innerHTML=renderChapter(parts[1],parts[2]);
 else if(type==='practice')app.innerHTML=startView(parts[1]);
 else if(type==='evidence')app.innerHTML=renderEvidence();
 else app.innerHTML=renderHome();
 document.title=(type==='home'?'أكاديمية الرياضيات الصغيرة':(app.querySelector('h1')?.textContent||'أكاديمية الرياضيات الصغيرة'))+' | ابتهال الحجيلي';
 document.getElementById('mainNav').hidden=true;document.getElementById('menuBtn').setAttribute('aria-expanded','false');
 window.scrollTo({top:0,behavior:'instant'});
}
document.addEventListener('click',e=>{
 const target=e.target.closest('button,[role="button"][data-nav]');if(!target)return;
 if(target.id==='menuBtn'){const nav=document.getElementById('mainNav');nav.hidden=!nav.hidden;target.setAttribute('aria-expanded',String(!nav.hidden));return;}
 if(target.id==='homeBtn'){navigate('home');return;}
 const d=target.dataset;
 if(d.nav){navigate(d.nav);return;}
 if(d.grade){if(d.grade==='1')navigate('lessons');else showToast(`سنفتح هذا الصف قريبًا!`);return;}
 if(d.chapter){navigate(`chapter/${d.chapter}/${d.mode||pageMode}`);return;}
 if(d.lesson){beginLesson(d.lesson);return;}
 if(d.answer!==undefined){answerQuestion(Number(d.answer));return;}
 if(d.next!==undefined){nextQuestion();return;}
 if(d.retry){beginLesson(d.retry);return;}
 if(d.export){exportResults(d.export);return;}
});
document.querySelector('.brand-mini')?.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();navigate('home')}});
window.addEventListener('hashchange',render);
window.addEventListener('DOMContentLoaded',()=>{render();});

</script>
<script src="./happy-games.js?v=5"></script>
<script src="announcements.js?v=5"></script>
</body>
